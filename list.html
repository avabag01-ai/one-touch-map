<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <!-- 캐시 완전 무시 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배송 리스트</title>
    <link rel="stylesheet" href="list-style.css?v=20260226">
    <link rel="stylesheet" href="main-style.css?v=20260226">
    <script src="android-back.js?v=20260226"></script>
    <script>(function () { var t = localStorage.getItem('appTheme'); if (t) document.documentElement.setAttribute('data-theme', t); })();</script>
</head>

<body>
    <!-- 헤더 -->
    <div class="header">
        <button class="back-btn" onclick="location.replace('index.html')">←</button>
        <span class="header-title">배송 목록 (<span id="totalCount">0</span>)</span>
        <button class="menu-btn"
            style="font-size: 14px; background: #FFC107; padding: 6px 10px; border-radius: 4px; color: #000;"
            id="optimizeBtn">🚀최적경로</button>
    </div>

    <!-- 상단 버튼들 -->
    <div class="action-buttons">
        <button class="action-btn" onclick="location.href='map.html'">
            지도
        </button>
        <button class="action-btn" id="deleteBtn">
            삭제
        </button>
        <button class="action-btn" id="fileBtn" style="background:#673AB7; color:white;">
            OCR 인식
        </button>
    </div>

    <div class="full-width-btn">
        <button class="action-btn-full">선택한주소 사용자 변경</button>
    </div>

    <!-- 지금갈곳 관리 버튼 -->
    <div class="layer-buttons">
        <button class="layer-btn" id="saveToNowBtn" style="flex: 2; background: #FF5252; color: white;">지금갈곳 저장</button>
        <button class="layer-btn clear" id="clearNowBtn" style="flex: 1;">해제</button>
    </div>

    <!-- 배송 리스트 -->
    <div class="delivery-list">
        <!-- 전체 선택 -->
        <div class="list-header">
            <label class="checkbox-label">
                <input type="checkbox" id="selectAll">
                <span>전체선택 (<span id="totalCount">0</span>건)</span>
            </label>
            <div class="date-container" style="display:flex; align-items:center; gap:5px;">
                <div class="date" id="currentDate" style="cursor:pointer; color:#3F51B5; font-weight:bold;"></div>
                <input type="date" id="datePicker" style="display:none;">
                <span style="font-size:12px; cursor:pointer;"
                    onclick="document.getElementById('datePicker').showPicker()">📅</span>
            </div>
        </div>

        <!-- 배송 목록 -->
        <div id="deliveryItems">
            <!-- 동적으로 생성됨 -->
        </div>
    </div>

    <!-- 스크립트 -->
    <script src="route-optimizer.js?v=20260226"></script>
    <script src="anchor-system.js?v=20260226"></script>
    <script src="list-app.js?v=20260226"></script>
    <!-- OCR 인식 (배송주소 화면) -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <div id="ocrModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>📝 스캔 결과 확인</h3>
            <p class="modal-desc">인식된 주소를 수정하거나 추가하세요.</p>
            <div id="scannedList" class="scanned-list"></div>
            <button id="addManualBtn" class="btn-add-manual">+ 직접 추가하기</button>
            <div class="modal-actions">
                <button id="cancelScanBtn" class="btn-cancel">취소</button>
                <button id="confirmScanBtn" class="btn-confirm">일괄 등록</button>
            </div>
        </div>
    </div>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <script src="ocr-app.js"></script>
    <script>
      function showToast(message){var t=document.createElement('div');t.textContent=message;t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:9999;';document.body.appendChild(t);setTimeout(function(){t.remove();},2000);}
      function onDeliveriesUpdated(){if(typeof loadDeliveries==='function')loadDeliveries();if(typeof renderList==='function')renderList();}
      if(typeof setupScanFeature==='function')setupScanFeature();
    </script>
</body>

</html>
