<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <!-- 캐시 완전 무시 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배송 리스트</title>
    <link rel="stylesheet" href="list-style.css?v=20260226">
    <link rel="stylesheet" href="main-style.css?v=20260226">
    <script src="android-back.js?v=20260226"></script>
    <script>(function () { var t = localStorage.getItem('appTheme'); if (t) document.documentElement.setAttribute('data-theme', t); })();</script>
    <script src="vworld-key.js"></script>
</head>

<body>
    <!-- 헤더 -->
    <div class="header">
        <button class="back-btn" onclick="location.replace('index.html')">←</button>
        <span class="header-title">배송 목록 (<span id="totalCount">0</span>)</span>
        <button class="menu-btn"
            style="font-size: 14px; background: #FFC107; padding: 6px 10px; border-radius: 4px; color: #000;"
            id="optimizeBtn">🚀최적경로</button>
    </div>

    <!-- 상단 버튼들 -->
    <div class="action-buttons">
        <button class="action-btn" onclick="location.href='map.html'">
            지도
        </button>
        <button class="action-btn" id="deleteBtn">
            삭제
        </button>
        <button class="action-btn" id="fileBtn" style="background:#673AB7; color:white;">
            OCR 인식
        </button>
        <button class="action-btn" id="geofenceBtn" data-on="0">
            📍 도착알림
        </button>
    </div>

    <div class="full-width-btn">
        <button class="action-btn-full">선택한주소 사용자 변경</button>
    </div>

    <!-- 지금갈곳 관리 버튼 -->
    <div class="layer-buttons">
        <button class="layer-btn" id="saveToNowBtn" style="flex: 2; background: #FF5252; color: white;">지금갈곳 저장</button>
        <button class="layer-btn clear" id="clearNowBtn" style="flex: 1;">해제</button>
    </div>

    <!-- 배송 리스트 -->
    <div class="delivery-list">
        <!-- 전체 선택 -->
        <div class="list-header">
            <label class="checkbox-label">
                <input type="checkbox" id="selectAll">
                <span>전체선택 (<span id="totalCount">0</span>건)</span>
            </label>
            <div class="date-container" style="display:flex; align-items:center; gap:5px;">
                <div class="date" id="currentDate" style="cursor:pointer; color:#3F51B5; font-weight:bold;"></div>
                <input type="date" id="datePicker" style="display:none;">
                <span style="font-size:12px; cursor:pointer;"
                    onclick="document.getElementById('datePicker').showPicker()">📅</span>
            </div>
        </div>

        <!-- 배송 목록 -->
        <div id="deliveryItems">
            <!-- 동적으로 생성됨 -->
        </div>
    </div>

    <!-- 스크립트 -->
    <script src="route-optimizer.js?v=20260226"></script>
    <script src="anchor-system.js?v=20260226"></script>
    <script src="list-app.js?v=20260226"></script>
    <!-- OCR 인식 (배송주소 화면) -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <!-- 사진 크롭 (주소 있는 부분만 선택해서 인식률 개선) -->
    <div id="cropModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>📐 인식할 부분 선택</h3>
            <p class="modal-desc">주소가 있는 부분만 손가락으로 드래그해 선택하세요.</p>
            <div id="cropStage" class="crop-stage">
                <canvas id="cropCanvas"></canvas>
                <div id="cropSelectionBox" class="crop-selection-box" style="display:none;"></div>
            </div>
            <div class="modal-actions">
                <button id="cropUseFullBtn" class="btn-cancel">전체 사용</button>
                <button id="cropCancelBtn" class="btn-cancel">취소</button>
                <button id="cropConfirmBtn" class="btn-confirm">이 부분 인식</button>
            </div>
        </div>
    </div>
    <div id="ocrModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>📝 스캔 결과 확인</h3>
            <p class="modal-desc">체크한 주소만 등록됩니다.</p>
            <div id="scannedList" class="scanned-list"></div>
            <button id="addManualBtn" class="btn-add-manual">+ 직접 추가하기</button>
            <div class="modal-actions">
                <button id="cancelScanBtn" class="btn-cancel">취소</button>
                <button id="confirmScanBtn" class="btn-confirm">일괄 등록</button>
            </div>
        </div>
    </div>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <script src="ocr-app.js"></script>
    <script>
      function showToast(message){var t=document.createElement('div');t.textContent=message;t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:9999;';document.body.appendChild(t);setTimeout(function(){t.remove();},2000);}
      function onDeliveriesUpdated(){if(typeof loadDeliveries==='function')loadDeliveries();if(typeof renderList==='function')renderList();}
      if(typeof setupScanFeature==='function')setupScanFeature();

      // === 도착 알림(지오펜싱) — 배송지 20m 근처 도착 시 번지수 알림 ===
      // 신주소(도로명) 건물번호를 우선 사용, 없으면 지번 번호
      function deliveryNumber(d){
        var road = d.addressAfter || '';
        var m = road.match(/(\d+(?:-\d+)?)\s*$/);
        if(m) return m[1];
        return d.jibun || d.addressBefore || '';
      }
      function geoPlugin(){ return window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Geofence; }
      function setGeoBtnUI(on){
        var btn = document.getElementById('geofenceBtn');
        if(!btn) return;
        btn.dataset.on = on ? '1' : '0';
        btn.textContent = on ? '📍 알림 켜짐' : '📍 도착알림';
        btn.style.background = on ? '#4CAF50' : '';
        btn.style.color = on ? '#fff' : '';
      }
      // 진단용 리스너 (1회만 등록): 감시 대상/거리와 도착 이벤트를 토스트로 표시
      function ensureGeoListeners(G){
        if(window.__geoListened) return;
        window.__geoListened = true;
        G.addListener('registered', function(e){ showToast('감시중: '+e.jibun+' ('+e.distance+'m 거리)'); });
        G.addListener('arrived', function(e){ showToast('도착! '+e.jibun); });
      }
      async function toggleGeofence(){
        var G = geoPlugin();
        if(!G){ showToast('이 기능은 설치된 앱에서만 동작해요'); return; }
        var btn = document.getElementById('geofenceBtn');
        var on = btn.dataset.on === '1';
        try {
          if(on){
            await G.stop();
            setGeoBtnUI(false);
            showToast('도착 알림 꺼짐');
          } else {
            var all = JSON.parse(localStorage.getItem('deliveries')||'[]');
            if(!all.length){ showToast('배송지가 없어요'); return; }
            // 좌표 없는 주소는 여기서 바로 지오코딩 (최적경로 안 돌려도 됨)
            var missing = all.filter(function(d){return !d.lat || !d.lng;});
            if(missing.length){
              showToast('주소 좌표 계산 중... ('+missing.length+'곳)');
              await RouteOptimizer.fillCoordinates(all);
              localStorage.setItem('deliveries', JSON.stringify(all));
            }
            var dests = all.filter(function(d){return d.lat && d.lng;})
                           .map(function(d){return {id:String(d.id), jibun:String(deliveryNumber(d)), lat:d.lat, lng:d.lng};});
            if(!dests.length){ showToast('좌표를 찾지 못했어요. 주소를 확인해 주세요'); return; }
            await G.requestGeoPermissions();
            ensureGeoListeners(G);
            await G.start({destinations:dests});
            setGeoBtnUI(true);
            var skipped = all.length - dests.length;
            showToast(dests.length+'곳 도착 알림 켜짐'+(skipped?' (좌표 실패 '+skipped+'곳 제외)':'')+' — 가장 가까운 곳 감시');
          }
        } catch(e){ showToast('오류: '+(e && e.message || e)); }
      }
      (function(){
        var b=document.getElementById('geofenceBtn');
        if(b) b.addEventListener('click', toggleGeofence);
        // 페이지 로드 시 네이티브 상태와 버튼 동기화 — 앱 재시작/화면 이동해도 켜짐 표시 유지
        var G = geoPlugin();
        if(G && G.status){
          G.status().then(function(s){
            if(s && s.enabled){ setGeoBtnUI(true); ensureGeoListeners(G); }
          }).catch(function(){});
        }
      })();
    </script>
</body>

</html>
