name: Build OpenMoa+ APK

on:
  push:
    paths:
      - 'openmoa-plus/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'openmoa-plus/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: openmoa-plus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmoa-plus-debug
          path: openmoa-plus/app/build/outputs/apk/debug/*.apk

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openmoa-plus-v1.0.${{ github.run_number }}
          name: "OpenMoa+ Build #${{ github.run_number }} (${{ steps.sha.outputs.short }})"
          body: |
            ## OpenMoa+ APK 다운로드

            아래 APK 파일을 다운로드해서 안드로이드 폰에 바로 설치하세요.

            ### 설치 방법
            1. **app-debug.apk** 다운로드
            2. 폰에서 "알 수 없는 앱 설치" 허용
            3. APK 설치
            4. 설정 → 시스템 → 언어 및 입력 → 화상 키보드 → OpenMoa 활성화
            5. 아무 입력창에서 키보드 전환해서 사용

            ### 주요 기능
            - 더블탭 삭제: 같은 자음 빠르게 두번 탭 → 글자 삭제
            - 방사형 모음 오버레이: 드래그 방향 시각화
            - 상단 프리뷰: 조합 중인 글자 실시간 표시
            - 계층적 힌트: 방향별 예측 글자 안내
          files: openmoa-plus/app/build/outputs/apk/debug/*.apk
          make_latest: true
